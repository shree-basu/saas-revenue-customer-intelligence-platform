[project]
name = "saas-revenue-customer-intelligence-platform"
version = "0.1.0"
description = "Cloud-free local reference for SaaS revenue analytics engineering"
requires-python = ">=3.12,<3.14"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
