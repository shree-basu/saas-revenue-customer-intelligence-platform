version: 2
models:
  - name: stg_accounts
    description: One current CRM account record per account_id in a validated source batch.
    columns:
      - name: account_id
        data_tests: [not_null, unique]
      - name: account_status
        data_tests:
          - accepted_values:
              arguments:
                values: [ACTIVE, INACTIVE]
  - name: stg_subscriptions
    description: One subscription contract/version per subscription_id in a validated source batch.
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
  - name: stg_invoices
    description: One billing invoice per invoice_id.
    columns:
      - name: invoice_id
        data_tests: [not_null, unique]
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
      - name: amount
        data_tests: [not_null]
  - name: stg_product_usage_daily
    description: One account/product/usage_date source observation.
    columns:
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: usage_date
        data_tests: [not_null]
  - name: stg_support_cases
    description: One support case per case_id.
    columns:
      - name: case_id
        data_tests: [not_null, unique]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
  - name: stg_sales_targets
    description: One month/region/segment planning target.
    columns:
      - name: target_month
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]
      - name: segment
        data_tests: [not_null]
  - name: stg_products
    description: One product reference row per product_id.
    columns:
      - name: product_id
        data_tests: [not_null, unique]
  - name: stg_plans
    description: One plan reference row per plan_id.
    columns:
      - name: plan_id
        data_tests: [not_null, unique]
