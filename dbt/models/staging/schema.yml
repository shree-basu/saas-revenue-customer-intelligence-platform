version: 2
models:
  - name: stg_accounts
    description: One current CRM account record per account_id in a validated source batch.
    columns:
      - name: account_id
        data_tests: [not_null, unique]
      - name: account_status
        data_tests:
          - accepted_values:
              arguments:
                values: [ACTIVE, INACTIVE]
  - name: stg_subscriptions
    description: One subscription contract/version per subscription_id in a validated source batch.
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
