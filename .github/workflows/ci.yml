name: Cloud-free CI

on:
  push:
    branches: [main, feat/saas-platform-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked local tools
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Static and unit validation
        run: |
          ruff check .
          ruff format --check .
          python -m compileall -q data local scripts tests
          python -m pytest -q
          python scripts/check_repo_safety.py
          python scripts/validate_snowflake_reference.py
          python scripts/validate_fabric_artifacts.py
      - name: Local dbt reference build
        run: |
          python -m data.generate_saas_batch --business-date 2026-10-09 --batch-id ci-normal --seed 17 --accounts 12 --scenario normal --output-root data/input
          python -m local.landing --delivery data/input/business_date=2026-10-09/batch_id=ci-normal --database dbt/target/saas.duckdb
          dbt build --project-dir dbt --profiles-dir dbt --target local
